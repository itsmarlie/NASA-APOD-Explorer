<script>
/* ── STARFIELD ── */
(function () {
  const sf = document.getElementById('starfield');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 180; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 1.8 + 0.3;
    s.style.cssText = [
      `width:${size}px`, `height:${size}px`,
      `top:${Math.random() * 100}%`, `left:${Math.random() * 100}%`,
      `--d:${(Math.random() * 5 + 2).toFixed(1)}s`,
      `--delay:${(Math.random() * 8).toFixed(1)}s`,
      `--p:${(Math.random() * 0.7 + 0.1).toFixed(2)}`
    ].join(';');
    frag.appendChild(s);
  }
  sf.appendChild(frag);
})();

/* ── CONFIG ── */
const API_BASE = '';  // leave empty since frontend is served by same Express server

/* ── STATE ── */
let chatHistory = [];
let apodContext = '';
let isSending = false;

/* ── HELPERS ── */
function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 6000);
}

function addMessage(role, text, extra) {
  const box = document.getElementById('chat-messages');
  const d = document.createElement('div');
  d.className = `msg ${role}${extra ? ' ' + extra : ''}`;
  d.innerHTML = extra === 'thinking'
    ? `<span class="thinking-dots">${text}</span>`
    : escapeHtml(text);
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderApod(data) {
  const img     = document.getElementById('apod-image');
  const shimmer = document.getElementById('shimmer');

  document.getElementById('apod-title').textContent = data.title || 'Untitled';
  document.getElementById('apod-date').textContent  = data.date  || '';
  document.getElementById('apod-desc').textContent  = data.explanation || '';

  apodContext = `Title: ${data.title}\nDate: ${data.date}\nExplanation: ${data.explanation}`;

  const src = data.hdurl || data.url || '';
  if (!src || data.media_type === 'video') {
    shimmer.style.display = 'none';
    img.style.display = 'none';
    return;
  }

  img.onload = () => {
    img.classList.add('visible');
    shimmer.style.display = 'none';
  };
  img.src = src;
}

/* ── LOAD APOD ── */
async function loadApod() {
  try {
    document.getElementById('apod-title').textContent = 'Loading today\'s image…';
    const res = await fetch(`${API_BASE}/api/apod`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderApod(data);
  } catch (e) {
    document.getElementById('apod-title').textContent = "Could not load today's image.";
    showError('Failed to fetch NASA APOD data. Is the server running?');
    console.error(e);
  }
}

/* ── CHAT ── */
async function sendMessage() {
  if (isSending) return;

  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  isSending = true;
  input.value = '';
  input.disabled = true;

  addMessage('user', text);
  chatHistory.push({ role: 'user', content: text });

  const thinking = addMessage('ai', 'Thinking', 'thinking');

  const systemMessage = {
    role: 'system',
    content: apodContext
      ? `You are an enthusiastic astronomy guide helping a user explore NASA's Astronomy Picture of the Day.\n\nToday's picture:\n${apodContext}\n\nAnswer with passion and scientific accuracy. Keep answers to 2–4 sentences unless asked for more. Use accessible language. Spark curiosity.`
      : `You are an astronomy guide. The NASA image is still loading — answer general astronomy questions in the meantime.`
  };

  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [systemMessage, ...chatHistory]
      })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail?.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || 'No response received.';

    thinking.remove();
    addMessage('ai', reply);
    chatHistory.push({ role: 'assistant', content: reply });

    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);

  } catch (e) {
    thinking.remove();
    addMessage('ai', `⚠️ Error: ${e.message}`);
    chatHistory.pop();
    showError('Chat request failed.');
  } finally {
    isSending = false;
    input.disabled = false;
    input.focus();
  }
}

/* ── EVENTS ── */
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

/* ── INIT ── */
loadApod();
</script>
